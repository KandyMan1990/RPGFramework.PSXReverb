name: Plugins

# Builds the Unity plugin for every platform on each push. Run by hand with "commit" ticked, it also commits what it
# built into Runtime/Plugins, so the package works from a git URL with no build step.
on:
  push:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit the built plugins into Runtime/Plugins
        type: boolean
        default: false

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: macos, os: macos-latest }
          - { preset: windows-x64, os: windows-latest }
          - { preset: windows-x86, os: windows-latest }
          # On an Arm runner, so the tests run on the CPU the plugin is for.
          - { preset: windows-arm64, os: windows-11-arm }
          # The oldest Ubuntu Unity 6.6 supports, so the library asks for no newer glibc than it has.
          - { preset: linux, os: ubuntu-22.04 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Native~
    steps:
      - uses: actions/checkout@v5
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}
      - name: What the library exports and the glibc it needs
        if: matrix.preset == 'linux'
        run: |
          nm -D --defined-only build/linux/libaudioplugin_psxreverb.so
          objdump -T build/linux/libaudioplugin_psxreverb.so | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - run: cmake --install build/${{ matrix.preset }} --config Release --prefix "${{ runner.temp }}/package"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.preset }}
          path: ${{ runner.temp }}/package

  android:
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Native~
    steps:
      - uses: actions/checkout@v5
      - run: cat "$ANDROID_NDK_HOME/source.properties"
      - run: cmake --preset android-${{ matrix.abi }}
      - run: cmake --build --preset android-${{ matrix.abi }}
      - name: Every segment aligned to 16 KB pages
        run: |
          readelf -lW build/android-${{ matrix.abi }}/libaudioplugin_psxreverb.so | awk '$1 == "LOAD" { print $NF }' | tee alignments
          python3 -c "import sys; a = [int(x, 16) for x in open('alignments')]; sys.exit(0 if a and min(a) >= 16384 else 'no LOAD segment, or one aligned to less than 16 KB')"
      - run: cmake --install build/android-${{ matrix.abi }} --prefix "${{ runner.temp }}/package"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-android-${{ matrix.abi }}
          path: ${{ runner.temp }}/package

  ios:
    strategy:
      fail-fast: false
      matrix:
        # The platform each object must be marked for: 2 is iOS, 7 the iOS Simulator.
        include:
          - { preset: ios, platform: 2 }
          - { preset: ios-simulator, platform: 7 }
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Native~
    steps:
      - uses: actions/checkout@v5
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - name: The entry point alone is global, and every CPU is marked for its platform
        run: |
          library=build/${{ matrix.preset }}/libaudioplugin_psxreverb.a
          names=$(nm -gUj -arch all "$library" | grep '^_' | sort -u)
          echo "$names"
          test "$names" = "_psx_reverb_get_audio_effect_definitions"
          for arch in $(lipo -archs "$library"); do
            otool -arch "$arch" -l "$library" | grep -A2 LC_BUILD_VERSION | grep -q "platform ${{ matrix.platform }}$" \
              || { echo "$arch is not marked for platform ${{ matrix.platform }}"; exit 1; }
          done
      - run: cmake --install build/${{ matrix.preset }} --prefix "${{ runner.temp }}/package"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.preset }}
          path: ${{ runner.temp }}/package

  commit:
    if: github.event_name == 'workflow_dispatch' && inputs.commit
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          path: ${{ runner.temp }}/plugins
      # Every platform installs the shared folders' .meta files. The download action unpacks artifacts at once, so
      # merging them there left a file part one copy and part another; they are merged one at a time instead, and a
      # file two platforms disagree on fails the run.
      - name: Merge the plugins
        run: |
          merged="$RUNNER_TEMP/merged"
          mkdir -p "$merged"
          for artifact in "$RUNNER_TEMP"/plugins/*; do
            (cd "$artifact" && find . -type f) | while read -r file; do
              if [ -e "$merged/$file" ]; then
                cmp -s "$artifact/$file" "$merged/$file" || { echo "$file differs in $(basename "$artifact")"; exit 1; }
              else
                mkdir -p "$(dirname "$merged/$file")"
                cp "$artifact/$file" "$merged/$file"
              fi
            done
          done
          cp -R "$merged"/. .
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Runtime Runtime.meta
          if git diff --cached --quiet; then
            echo "The plugins are unchanged."
            exit 0
          fi
          git commit -m "Update the built plugins" -m "Built by the Plugins workflow from ${GITHUB_SHA::7}."
          git push
